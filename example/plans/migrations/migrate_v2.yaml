version: 2
identifier: migrate_v2
name: Migrate to example v2
description: Rewrites the plans, agents and tools that call this pack's v1 names to its v2 names and inputs. With apply false it changes nothing and returns each file's diff.
input_schema:
  type: object
  required: [root]
  properties:
    root:
      type: string
      description: Directory holding the plans, agents and tools directories to migrate, such as .dive or ~/.config/dive
    apply:
      type: boolean
      default: false
      description: Write the migrated files; false only returns diffs
output_schema:
  type: object
  required: [applied, files]
  properties:
    applied: { type: boolean }
    files:
      type: array
      items:
        type: object
        properties:
          path:    { type: string }
          changed: { type: boolean }
          applied: { type: boolean }
          diff:    { type: string }
steps:
  - id: scan
    tool_name: $pack__tool__migrate_v2_scan
    input:
      pack: "{{pack.name}}"
      root: "{{input.root}}"
  - id: nothing_to_do
    tool_name: exit
    input:
      when: { value: "{{scan.files}}", op: empty }
      status: success
      message: No plan, agent or tool calls this pack's v1 names
      output: { applied: false, files: [] }
  - id: migrate
    tool_name: map
    input:
      over: "{{scan.files}}"
      concurrency: 4
      do:
        - id: write
          tool_name: $pack__tool__migrate_v2_write
          input:
            path: "{{item.path}}"
            pack: "{{pack.name}}"
            apply: "{{input.apply}}"
finish:
  output:
    applied: "{{input.apply}}"
    files: "{{migrate.results}}"
